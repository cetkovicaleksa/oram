title: FTN77 Thesis Quarto Extension
author: Алекса Ћетковић
version: 0.1.0
quarto-required: ">= 1.10.*"

contributes:
  format:
    common:
      lang: sr-Cyrl
      language: thesis/assets/language.yaml
      csl: assets/ieee.csl

    typst:
      papersize: a4
      mainfont: Times New Roman
      csl: ieee
      # disable quarto refs div injection
      cite-method: natbib
      include-in-header: # idk
        text: |
          #set bibliography(title: none)

    html: default

