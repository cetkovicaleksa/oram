title: Систем за приватну анализу графова над екстерно складиштеним шифрованим подацима уз заштиту образаца приступа примјеном ORAM механизма
keywords: []
degree: Основне академске студије
program: Софтверско инжењерство и информационе технологије
field: Електротехничко и рачунарско инжењерство
discipline: Примењене рачунарске науке и информатика
assignment: 
  Задатак овог рада је дизајн, имплементација и евалуација система који омогућава извршавање BFS
  алгоритма над шифрованим графом складиштеним на непоузданом серверу, тако да серверу обрасци
  приступа не могу статистички да се разликују за различите полазне чворове, уз примјену Path ORAM
  механизма и додатних митигација за цурење кроз структуралне карактеристике графа.

